services:
  private-control-socket-init:
    image: alpine:3.19
    command:
      - sh
      - -ec
      - >-
        mkdir -p /run/incomudon-pcl &&
        chown 10001:10003 /run/incomudon-pcl &&
        chmod 0750 /run/incomudon-pcl
    volumes:
      - private-control-socket:/run/incomudon-pcl
    restart: "no"

  relay:
    environment:
      INCOMUDON_MANAGEMENT_ENABLED: "false"
      INCOMUDON_PRIVATE_CONTROL_ENABLED: "true"
      INCOMUDON_PRIVATE_CONTROL_TRANSPORT: "uds"
      INCOMUDON_PRIVATE_CONTROL_UDS_SOCKET_PATH: "/run/incomudon-pcl/relay.sock"
      INCOMUDON_PRIVATE_CONTROL_UDS_SOCKET_GROUP: "10003"
      INCOMUDON_PRIVATE_CONTROL_UDS_SERVICES_CSV: "/run/incomudon-private-control/uds-services.csv"
      INCOMUDON_PRIVATE_CONTROL_RELAY_ID: "${INCOMUDON_PRIVATE_CONTROL_RELAY_ID:-relay-local}"
      INCOMUDON_PRIVATE_CONTROL_STATE_FILE: "/var/lib/incomudon-private-control/state.json"
    group_add:
      - "10003"
    volumes:
      # The Relay can read its UDS peer-identity policy but cannot alter it.
      - "${INCOMUDON_PRIVATE_CONTROL_DATA_DIR:-./private-control}:/run/incomudon-private-control:ro"
      # Only the Relay creates the socket; the Management container receives
      # group write access to the socket but not to its parent directory.
      - private-control-socket:/run/incomudon-pcl
      # Deny rules and completed command acknowledgements must survive restarts.
      - "${INCOMUDON_PRIVATE_CONTROL_STATE_DIR:-./private-control-state}:/var/lib/incomudon-private-control"
    depends_on:
      private-control-socket-init:
        condition: service_completed_successfully
    networks:
      - default
      - management

  management:
    image: "${INCOMUDON_MANAGEMENT_IMAGE:-ghcr.io/friedoudon/incomudon-management:main}"
    restart: unless-stopped
    user: "10002:10002"
    group_add:
      - "10003"
    environment:
      INCOMUDON_MANAGEMENT_PCL_TRANSPORT: "uds"
      INCOMUDON_MANAGEMENT_PCL_UDS_SOCKET_PATH: "/run/incomudon-pcl/relay.sock"
      INCOMUDON_MANAGEMENT_PCL_SERVICE_ID: "${INCOMUDON_MANAGEMENT_PCL_SERVICE_ID:-management-main}"
      INCOMUDON_MANAGEMENT_PCL_COMMAND_STORE_FILE: "/var/lib/incomudon-management/pcl-revocations.json"
      INCOMUDON_MANAGEMENT_HTTP_LISTEN: ":8080"
    volumes:
      - private-control-socket:/run/incomudon-pcl
      # The Management Service durably retries accepted PCL revocations after
      # reconnect or restart. This state contains no grants or private keys.
      - "${INCOMUDON_MANAGEMENT_STATE_DIR:-./management-state}:/var/lib/incomudon-management"
    expose:
      - "8080"
    depends_on:
      private-control-socket-init:
        condition: service_completed_successfully
      relay:
        condition: service_started
    networks:
      - management

volumes:
  private-control-socket:

networks:
  management:
    internal: true
