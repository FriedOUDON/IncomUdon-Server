services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: incomudon-relay:local
    ports:
      - "${INCOMUDON_RELAY_PORT:-50000}:50000/udp"
    environment:
      INCOMUDON_TALK_MAX_SEC: "${INCOMUDON_TALK_MAX_SEC:-0}"
      INCOMUDON_MULTI_TALK: "${INCOMUDON_MULTI_TALK:-false}"
      INCOMUDON_MAX_ACTIVE_TALKERS: "${INCOMUDON_MAX_ACTIVE_TALKERS:-2}"
      INCOMUDON_CONTROL_AUTH_POLICY: "${INCOMUDON_CONTROL_AUTH_POLICY:-off}"
      INCOMUDON_SECRET_FILE_PERMISSIONS: "${INCOMUDON_SECRET_FILE_PERMISSIONS:-required}"
      INCOMUDON_CONTROL_KEY_FILE: "${INCOMUDON_CONTROL_KEY_FILE:-}"
      INCOMUDON_CONTROL_COOKIE_SECRET_FILE: "${INCOMUDON_CONTROL_COOKIE_SECRET_FILE:-}"
      INCOMUDON_IDENTITY_ADMISSION_MODE: "${INCOMUDON_IDENTITY_ADMISSION_MODE:-off}"
      INCOMUDON_IDENTITY_ISSUER: "${INCOMUDON_IDENTITY_ISSUER:-}"
      INCOMUDON_IDENTITY_AUDIENCE: "${INCOMUDON_IDENTITY_AUDIENCE:-}"
      INCOMUDON_IDENTITY_SIGNING_KEY_FILE: "${INCOMUDON_IDENTITY_SIGNING_KEY_FILE:-}"
      INCOMUDON_FLOOR_INTERRUPT_ENABLED: "${INCOMUDON_FLOOR_INTERRUPT_ENABLED:-false}"
      INCOMUDON_SERVICE_ADMISSION_MODE: "${INCOMUDON_SERVICE_ADMISSION_MODE:-off}"
      INCOMUDON_SERVICE_ADMISSION_ISSUER: "${INCOMUDON_SERVICE_ADMISSION_ISSUER:-}"
      INCOMUDON_SERVICE_ADMISSION_AUDIENCE: "${INCOMUDON_SERVICE_ADMISSION_AUDIENCE:-}"
      INCOMUDON_SERVICE_ADMISSION_SIGNING_KEY_FILE: "${INCOMUDON_SERVICE_ADMISSION_SIGNING_KEY_FILE:-}"
      INCOMUDON_DIRECTORY_ENABLED: "${INCOMUDON_DIRECTORY_ENABLED:-false}"
      INCOMUDON_DIRECTORY_TRANSPORT: "${INCOMUDON_DIRECTORY_TRANSPORT:-media-port}"
      INCOMUDON_DIRECTORY_KEY_FILE: "${INCOMUDON_DIRECTORY_KEY_FILE:-}"
      INCOMUDON_DIRECTORY_CHANNELS_CSV: "${INCOMUDON_DIRECTORY_CHANNELS_CSV:-}"
      INCOMUDON_DIRECTORY_SPEAKERS_CSV: "${INCOMUDON_DIRECTORY_SPEAKERS_CSV:-}"
      INCOMUDON_DIRECTORY_DEDICATED_LISTEN: "${INCOMUDON_DIRECTORY_DEDICATED_LISTEN:-}"
      INCOMUDON_DIRECTORY_PUBLISH_INTERVAL: "${INCOMUDON_DIRECTORY_PUBLISH_INTERVAL:-}"
      INCOMUDON_DIRECTORY_FRESHNESS_TTL: "${INCOMUDON_DIRECTORY_FRESHNESS_TTL:-}"
      INCOMUDON_MANAGEMENT_ENABLED: "${INCOMUDON_MANAGEMENT_ENABLED:-false}"
      INCOMUDON_MANAGEMENT_LISTEN: "${INCOMUDON_MANAGEMENT_LISTEN:-}"
      INCOMUDON_MANAGEMENT_CERT_FILE: "${INCOMUDON_MANAGEMENT_CERT_FILE:-}"
      INCOMUDON_MANAGEMENT_KEY_FILE: "${INCOMUDON_MANAGEMENT_KEY_FILE:-}"
      INCOMUDON_MANAGEMENT_CLIENT_CA_FILE: "${INCOMUDON_MANAGEMENT_CLIENT_CA_FILE:-}"
      INCOMUDON_MANAGEMENT_SERVICES_CSV: "${INCOMUDON_MANAGEMENT_SERVICES_CSV:-}"
      INCOMUDON_MANAGEMENT_CHANNEL_ACL_CSV: "${INCOMUDON_MANAGEMENT_CHANNEL_ACL_CSV:-}"
      INCOMUDON_MANAGEMENT_GLOBAL_PERMISSIONS_CSV: "${INCOMUDON_MANAGEMENT_GLOBAL_PERMISSIONS_CSV:-}"
      INCOMUDON_MANAGEMENT_SIGNING_KEY_FILE: "${INCOMUDON_MANAGEMENT_SIGNING_KEY_FILE:-}"
    volumes:
      # Relay configuration and private material are never writable in-container.
      - "${INCOMUDON_CONTROL_DATA_DIR:-./control}:/run/incomudon-control:ro"
      - "${INCOMUDON_IDENTITY_DATA_DIR:-./identity}:/run/incomudon-identity:ro"
      - "${INCOMUDON_SERVICE_ADMISSION_DATA_DIR:-./service-admission}:/run/incomudon-service-admission:ro"
      - "${INCOMUDON_DIRECTORY_DATA_DIR:-./directory-v3}:/run/incomudon-directory-v3:ro"
      - "${INCOMUDON_MANAGEMENT_DATA_DIR:-./management}:/run/incomudon-management:ro"
    restart: unless-stopped
